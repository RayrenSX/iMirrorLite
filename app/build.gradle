plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.rayren.imirrorlite'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'com.rayren.imirrorlite'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0-dev'
        testInstrumentationRunner 'com.rayren.imirrorlite.RuntimeSmokeTest'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

chaquopy {
    defaultConfig {
        version = '3.13'
        pip {
            options '--no-deps'
            install '-r', 'src/main/python/requirements-android.txt'
        }
    }
}
